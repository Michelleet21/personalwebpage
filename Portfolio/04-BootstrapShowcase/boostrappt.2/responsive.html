<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Demo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode" id="pageBody">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">BrandName</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Features</a>
                </li>
            </ul>
            <form class="form-inline my-2 my-lg-0">
                <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Search</button>
            </form>
        </div>
    </nav>

    <div class="sidebar">
        <h4 class="text-center">Menu</h4>
        <button class="btn btn-secondary btn-block mb-3" data-toggle="collapse" data-target="#sidebarMenu" aria-expanded="false">
            <i class="fas fa-bars"></i> Toggle Sidebar
        </button>
        <div id="sidebarMenu" class="collapse show">
            <a href="#" class="btn btn-link btn-block">Home</a>
            <a href="#" class="btn btn-link btn-block">About</a>
            <a href="#" class="btn btn-link btn-block">Contact</a>
        </div>
    </div>

    <div class="content p-3">
        <h2>Main Content Area</h2>
        <p>This is the main content area of the page.</p>

        <div class="dropdown my-3">
            <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <i class="fas fa-user"></i> Profile Options
            </button>
            <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                <a class="dropdown-item" href="#"><i class="fas fa-cog"></i> Settings</a>
                <a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <button class="btn btn-dark" onclick="toggleColorMode()">Toggle Dark Mode</button>
    </div>

    <footer class="custom-footer">
        <span>&copy; 2024 BrandName</span>
        <span>Follow us on:
            <a href="#" class="text-white ml-2"><i class="fab fa-facebook"></i></a>
            <a href="#" class="text-white ml-2"><i class="fab fa-twitter"></i></a>
            <a href="#" class="text-white ml-2"><i class="fab fa-instagram"></i></a>
        </span>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.4.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script>
        function toggleColorMode() {
            const body = document.getElementById('pageBody');
            body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
