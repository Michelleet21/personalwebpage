<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Exercises - Pig Latin</title>
    <script type="text/javascript" src="js/pig_latin.js"></script>
</head>

<body>
    <h1>Pig Latin Translator</h1>
    <hr />
    <p>Pig Latin is a playful language transformation where words are altered by moving the initial consonant(s) to the end and adding a suffix.</p>
    <div>
        <input type="text" id="txtVal" placeholder="Enter text to translate" />
        <button id="btn" onclick="translateToPigLatin()">Translate</button>
        <br />
        <span id="pigLatin"></span>
    </div>
</body>
</html>
